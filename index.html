<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#EDE9E2" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <!-- Open Graph — static site-wide default. Note: link-unfurling crawlers
         (iMessage, Slack, etc.) fetch this HTML without running JS, so a truly
         per-duel preview (custom title naming the setter, etc.) would need a
         Netlify Edge Function rendering these tags server-side per slug —
         not yet built. This default at least gives every duel link a proper
         branded card instead of a bare URL. -->
    <meta property="og:title" content="Netera Duel" />
    <meta property="og:description" content="A friend has challenged you to a word duel." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://neteraduel.com/" />
    <meta property="og:image" content="https://neteraduel.com/og-image.png" />
    <meta property="og:image:width" content="1536" />
    <meta property="og:image:height" content="1024" />
    <meta property="og:image:alt" content="Netera Duel" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Netera Duel" />
    <meta name="twitter:description" content="A friend has challenged you to a word duel." />
    <meta name="twitter:image" content="https://neteraduel.com/og-image.png" />

    <title>Netera Duel</title>

    <!-- Plausible: site-specific script auto-tracks pageviews on pushState
         navigation (our router uses history.pushState, see src/App.jsx), so
         SPA route changes are picked up with no extra wiring. The queue shim
         lets plausible() calls in our code work even before the script loads. -->
    <!-- Privacy-friendly analytics by Plausible -->
    <script async src="https://plausible.io/js/pa-dxiES6O7H_FJpv985Hg3G.js"></script>
    <script>
      window.plausible=window.plausible||function(){(plausible.q=plausible.q||[]).push(arguments)},plausible.init=plausible.init||function(i){plausible.o=i||{}};
      plausible.init()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
