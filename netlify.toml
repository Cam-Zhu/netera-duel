[build]
  command = "npm run build"
  publish = "dist"

# Rewrites the static OG tags in index.html per duel. Runs before the SPA
# redirect below, so context.next() inside it still resolves to index.html.
# Needs the runtime env vars SUPABASE_URL / SUPABASE_ANON_KEY (see .env.example)
# — the build-time VITE_ ones aren't visible to edge functions.
[[edge_functions]]
  path = "/d/*"
  function = "og"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Keep duel links out of search results — every /d/<slug> is a thin near-copy
# of the home page. The edge function above also injects a robots meta tag;
# this header covers the case where a crawler honours headers before markup.
[[headers]]
  for = "/d/*"
  [headers.values]
    X-Robots-Tag = "noindex"

# Vite fingerprints everything under /assets/, so it can be cached forever —
# a changed file always has a new name. Faster repeat loads feed into Core Web
# Vitals, which is a (small) ranking signal.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
